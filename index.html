<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page 2 - Indian Logo Page</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background-color: #111; }
        
        .layout-container {
            display: grid;
            width: 100vw;
            min-height: 100vh;
            grid-template-rows: 200px auto;
            grid-template-columns: 60% 40%;
            grid-template-areas: "part1 part1" "part2 part3";
            background: rgb(128, 194, 255);
        }
        .part-1 {
            grid-area: part1; background: rgb(103, 159, 255);
            display: flex; align-items: center; justify-content: center;
            position: relative; height: 200px; width: 100%;
            padding: 0 280px; /* Logo ke liye space aur badha diya gaya hai */
        }
        .part-2 { grid-area: part2; background: rgb(128, 194, 255); padding: 15px; overflow-y: auto; }
        .part-3 { grid-area: part3; background: rgb(152, 229, 255); padding: 15px; overflow-y: auto; }
        
        .switch-container { display: flex; justify-content: space-between; gap: 12px; margin-top: 15px; }
        .switch-btn {
            flex: 1; padding: 10px 5px; background-color: #1f51ff; color: #ffffff;
            border: 2px solid #001f3f; border-radius: 10px; font-family: 'Cambria', Georgia, serif;
            font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; display: block;
        }
        .switch-btn.active { background-color: #ff9800; border-color: #b36b00; }
        
        /* Dono logo ko aur andar ki taraf khiska diya gaya hai */
        .left-logo { position: absolute; top: 35px; left: 150px; }
        .left-logo img { width: 95px; height: auto; display: block; }
        
        .right-logo { position: absolute; top: 35px; right: 150px; }
        .right-logo img { width: 150px; height: auto; display: block; }
        
        .center-text-container { text-align: center; color: #ffff00; font-weight: bold; width: 100%; }
        .hindi-text { font-family: 'Aparajita', 'Tiro Devanagari Hindi', sans-serif; font-size: 30px; margin-bottom: 2px; }
        .english-text { font-family: 'Cambria', Georgia, serif; font-size: 25px; margin-bottom: 8px; }
        .sub-header-text { font-family: 'Cambria', Georgia, serif; font-size: 20px; color: #5C2C14; }
        
        .boxes-grid { display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 20px; column-gap: 20px; width: 100%; }
        
        .box-card {
            display: flex; flex-direction: column; align-items: center; width: 100%; padding: 6px;
            border: 1px solid rgba(0, 0, 0, 0.4); border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.7), 0 4px 8px rgba(0, 0, 0, 0.5);
            background: transparent;
            transition: transform 0.1s ease;
        }

        .box-card:hover {
            animation: shake 0.4s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-1px, -2px) rotate(-1deg); }
            40% { transform: translate(-3px, 0px) rotate(1deg); }
            60% { transform: translate(3px, 2px) rotate(0deg); }
            80% { transform: translate(1px, -1px) rotate(1deg); }
            100% { transform: translate(-1px, 2px) rotate(-1deg); }
        }
        
        .sky-blue-box {
            width: 100%; height: 38px; border: 2px solid #5C2C14; border-radius: 6px;
            background-color: #A0522D; display: flex; align-items: center; justify-content: center;
            font-family: 'Cambria', Georgia, serif; font-size: 18px; font-weight: bold; 
            color: blue !important; margin-bottom: 4px;
        }

        #set-1 .sky-blue-box, #set-2 .sky-blue-box, #set-3 .sky-blue-box, #set-4 .sky-blue-box,
        #set-5 .sky-blue-box, #set-6 .sky-blue-box, #set-7 .sky-blue-box, #set-12 .sky-blue-box,
        #set-13 .sky-blue-box, #set-14 .sky-blue-box, #set-15 .sky-blue-box, #set-16 .sky-blue-box,
        #set-20 .sky-blue-box, #set-21 .sky-blue-box, #set-22 .sky-blue-box {
            background-color: #D2B48C !important; color: blue !important; border-color: #8B4513 !important;
        }

        #set-8 .sky-blue-box { background-color: pink !important; color: blue !important; border-color: #c71585 !important; }

        #set-9 .sky-blue-box, #set-10 .sky-blue-box, #set-11 .sky-blue-box, #set-12 .sky-blue-box {
            background-color: #90ee90 !important; color: blue !important; border-color: #2e8b57 !important;
        }
        
        #set-17 .sky-blue-box, #set-18 .sky-blue-box, #set-19 .sky-blue-box {
            background-color: #e0f447 !important; color: blue !important; border-color: #2e8b57 !important;
        }

        .sub-boxes { display: flex; width: 100%; height: 30px; gap: 4px; }
        .sky-blue-box-21, .sky-blue-box-3 {
            width: 50%; height: 30px; border: 2px solid rgb(175, 163, 163); border-radius: 6px;
            display: flex; align-items: center; justify-content: center; color: white;
            font-family: 'Cambria', Georgia, serif; font-size: 14px; font-weight: bold;
        }
        .sub-boxes-4 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; width: 100%; }
        .sub-boxes-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 100%; }
        .mini-box {
            height: 30px; border: 2px solid rgb(175, 163, 163); display: flex; align-items: center;
            justify-content: center; color: #ffffff; font-family: 'Cambria', Georgia, serif;
            font-size: 13px; font-weight: bold; border-radius: 6px;
        }
        .custom-table { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 4px; font-family: 'Cambria', Georgia, serif; font-size: 13px; text-align: center; }
        .table-second { margin-top: 15px; }
        .custom-table th, .custom-table td { border: 1px solid #999; border-radius: 8px; padding: 6px 2px; height: 32px; background-color: #ffffff; vertical-align: middle; }
        .custom-table th { background-color: #1f51ff; color: #ffffff; border-color: #001f3f; }
        
        .staff-data-row td {
            background-color: #ffffff; color: #000000; font-weight: bold; font-size: 14px;
            border: 2px solid rgb(175, 163, 163);
        }

        .has-value { background-color: #dc3545 !important; color: #ffffff !important; border-color: #a71d2a !important; }
        .is-empty { background-color: #28a745 !important; color: #ffffff !important; border-color: #1e7e34 !important; }

        /* ================= MOBILE RESPONSIVE MEDIA QUERY ================= */
        @media screen and (max-width: 1024px) {
            .layout-container {
                grid-template-rows: auto auto auto;
                grid-template-columns: 100%;
                grid-template-areas: 
                    "part1"
                    "part2"
                    "part3";
                height: auto;
                overflow-y: auto;
            }
            .part-1 {
                height: auto;
                padding: 20px 10px;
                flex-direction: column;
            }
            .left-logo, .right-logo {
                position: static;
                margin-bottom: 8px;
            }
            .left-logo img { width: 70px; }
            .right-logo img { width: 110px; }
            .center-text-container { padding: 0; }
            .hindi-text { font-size: 18px; }
            .english-text { font-size: 13px; }
            .sub-header-text { font-size: 13px; }
            
            .boxes-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media screen and (max-width: 600px) {
            .boxes-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="layout-container">
        <div class="part-1">
            <div class="logo left-logo"><img src="indian logo.jpeg" alt="Indian Logo"></div>
            <div class="center-text-container">
                <div class="hindi-text">संयुक्त रनिंग रूम, दक्षिण पूर्व मध्य रेलवे, शहडोल</div>
                <div class="english-text">COMBIND RUNNING ROOM, SOUTH EAST CENTRAL RAILWAY, SHAHDOL</div>
                <div class="sub-header-text">OCCUPANCY PANEL</div>
            </div>
            <div class="logo right-logo"><img src="Vande_Bharat.jpeg" alt="Vande Bharat Logo"></div>
        </div>

        <div class="part-2"><div class="boxes-grid"></div></div>

        <div class="part-3">
            <table class="custom-table" id="staff-table">
                <thead>
                    <tr><th colspan="4">AVAILABLE STAFF</th><th rowspan="2">LR / HD</th><th rowspan="2">TOTAL STAFF</th><th rowspan="2">VACANT BED</th></tr>
                    <tr><th>LPP/M</th><th>LPG</th><th>ALP</th><th>TM</th></tr>
                </thead>
                <tbody id="staff-tbody">
                    <tr class="staff-data-row">
                        <td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>
                    </tr>
                </tbody>
            </table>

            <table class="custom-table table-second" id="q2u10-table">
                <thead>
                    <tr><th>USL</th><th>PND</th><th>BJRI</th><th>SGO</th><th>SJQ</th><th>BSP - C</th><th>LR</th></tr>
                </thead>
                <tbody id="q2u10-tbody">
                    <tr><td colspan="7">-</td></tr>
                </tbody>
            </table>

            <div class="switch-container">
                <a href="form.html" class="switch-btn active" id="1">BOOKING STATUS</a>
                <button class="switch-btn">SWITCH 3</button>
            </div>
        </div>
    </div>

    <script>
        const roomNames = {
            1: "ROOM NO. - 1", 2: "ROOM NO. - 2", 3: "ROOM NO. - 3", 4: "ROOM NO. - 4",
            5: "ROOM NO. - 5", 6: "ROOM NO. - 6", 7: "ROOM NO. - 7", 8: "ROOM NO. - 8",
            9: "ROOM NO. - 13", 10: "ROOM NO. - 14", 11: "ROOM NO. - 15", 12: "ROOM NO. - 16",
            13: "ROOM NO. - 17", 14: "ROOM NO. - 18", 15: "ROOM NO. - M.2", 16: "ROOM NO. - M.3",
            17: "ROOM NO. - 09", 18: "ROOM NO. - 10", 19: "ROOM NO. - 11", 20: "ROOM NO. - 19",
            21: "ROOM NO. - 12", 22: "ROOM NO. - M.1"
        };

        function generate22Sets() {
            const gridContainer = document.querySelector('.boxes-grid');
            gridContainer.innerHTML = '';
            for (let i = 1; i <= 22; i++) {
                let cardHTML = '';
                const roomTitle = roomNames[i] || '';

                if (i >= 17 && i <= 20) {
                    cardHTML = `<div class="box-card" id="set-${i}"><div class="sky-blue-box">${roomTitle}</div><div class="sub-boxes-4"><div class="mini-box box-1">-</div><div class="mini-box box-2">-</div><div class="mini-box box-3">-</div><div class="mini-box box-4">-</div></div></div>`;
                } else if (i === 21 || i === 22) {
                    cardHTML = `<div class="box-card" id="set-${i}"><div class="sky-blue-box">${roomTitle}</div><div class="sub-boxes-3"><div class="mini-box box-1">-</div><div class="mini-box box-2">-</div><div class="mini-box box-3">-</div></div></div>`;
                } else if (i >= 9 && i <= 16) {
                    cardHTML = `<div class="box-card" id="set-${i}"><div class="sky-blue-box">${roomTitle}</div><div class="sub-boxes-4" style="grid-template-columns: 1fr 1fr;"><div class="mini-box box-1">-</div><div class="mini-box box-2">-</div></div></div>`;
                } else {
                    cardHTML = `<div class="box-card" id="set-${i}"><div class="sky-blue-box">${roomTitle}</div><div class="sub-boxes"><div class="sky-blue-box-21 box-1">-</div><div class="sky-blue-box-3 box-2">-</div></div></div>`;
                }
                gridContainer.insertAdjacentHTML('beforeend', cardHTML);
            }
        }

        function formatTimeToHHMM(val) {
            if (!val || val === '-') return '-';
            if (typeof val === 'string' && val.includes('T')) {
                let timePart = val.split('T')[1];
                if (timePart) {
                    let parts = timePart.split(':');
                    if (parts.length >= 2) {
                        return parts[0] + ':' + parts[1];
                    }
                }
            }
            return val;
        }

        function setBoxValueAndColor(boxEl, val) {
            if (!boxEl) return;
            let hasVal = (val !== undefined && val !== null && val !== "" && val !== "-");
            boxEl.innerText = hasVal ? val : '-';
            
            if (hasVal) {
                boxEl.classList.add('has-value');
                boxEl.classList.remove('is-empty');
            } else {
                boxEl.classList.add('is-empty');
                boxEl.classList.remove('has-value');
            }
        }

        window.handleSheetData = function(data) {
            if (!data || !Array.isArray(data)) return;

            const mapping = {
                1: { rowIndex: 1, fCol: 5, hCol: 7 }, 
                2: { rowIndex: 2, fCol: 5, hCol: 7 }, 
                3: { rowIndex: 3, fCol: 5, hCol: 7 }, 
                4: { rowIndex: 4, fCol: 5, hCol: 7 }, 
                5: { rowIndex: 5, fCol: 5, hCol: 7 }, 
                6: { rowIndex: 6, fCol: 5, hCol: 7 }, 
                7: { rowIndex: 7, fCol: 5, hCol: 7 }, 
                8: { rowIndex: 8, fCol: 5, hCol: 7 },
                9: { rowIndex: 22, fCol: 5, hCol: 7 },  
                10: { rowIndex: 23, fCol: 5, hCol: 7 }, 
                11: { rowIndex: 24, fCol: 5, hCol: 7 }, 
                12: { rowIndex: 25, fCol: 5, hCol: 7 }, 
                13: { rowIndex: 26, fCol: 5, hCol: 7 }, 
                14: { rowIndex: 27, fCol: 5, hCol: 7 }, 
                15: { rowIndex: 31, fCol: 5, hCol: 7 },
                16: { rowIndex: 32, fCol: 5, hCol: 7 },
                17: { rows: [9, 10, 11, 12], col: 9 },
                18: { rows: [13, 14, 15, 16], col: 9 },
                19: { rows: [17, 18, 19, 20], col: 9 },
                20: {
                    cells: [
                        { r: 28, c: 5 }, { r: 28, c: 7 }, 
                        { r: 29, c: 5 }, { r: 29, c: 7 }
                    ]
                },
                21: {
                    cells: [
                        { r: 21, c: 5 }, { r: 21, c: 7 }, { r: 21, c: 9 }
                    ]
                },
                22: {
                    cells: [
                        { r: 30, c: 5 }, { r: 30, c: 7 }, { r: 30, c: 9 }
                    ]
                }
            };

            for (let secId in mapping) {
                let map = mapping[secId];
                let card = document.getElementById(`set-${secId}`);
                if (!card) continue;

                if (map.cells) {
                    for (let idx = 0; idx < map.cells.length; idx++) {
                        let cellInfo = map.cells[idx];
                        let boxNum = idx + 1;
                        let boxEl = card.querySelector(`.box-${boxNum}`);
                        if (boxEl && data[cellInfo.r]) {
                            let val = data[cellInfo.r][cellInfo.c];
                            setBoxValueAndColor(boxEl, val);
                        }
                    }
                } 
                else if (map.rows) {
                    for (let idx = 0; idx < map.rows.length; idx++) {
                        let rIdx = map.rows[idx];
                        let boxNum = idx + 1;
                        let boxEl = card.querySelector(`.box-${boxNum}`);
                        if (boxEl && data[rIdx]) {
                            let val = data[rIdx][map.col];
                            setBoxValueAndColor(boxEl, val);
                        }
                    }
                } else {
                    if (data[map.rowIndex]) {
                        let box1 = card.querySelector('.box-1');
                        let box2 = card.querySelector('.box-2');

                        let val1 = data[map.rowIndex][map.fCol];
                        let val2 = data[map.rowIndex][map.hCol];

                        setBoxValueAndColor(box1, val1);
                        setBoxValueAndColor(box2, val2);
                    }
                }
            }

            const staffTbody = document.getElementById('staff-tbody');
            if (staffTbody) {
                staffTbody.innerHTML = '';
                let r = 17;
                let rowHtml = '<tr class="staff-data-row">';
                for (let c = 16; c <= 22; c++) {
                    let cellVal = '-';
                    if (data[r] && data[r][c] !== undefined && data[r][c] !== null && data[r][c] !== "") {
                        cellVal = data[r][c];
                    }
                    rowHtml += `<td>${cellVal}</td>`;
                }
                rowHtml += '</tr>';
                staffTbody.insertAdjacentHTML('beforeend', rowHtml);
            }

            const tbody = document.getElementById('q2u10-tbody');
            if (tbody) {
                tbody.innerHTML = '';
                for (let r = 1; r <= 10; r++) {
                    let rowHtml = '<tr>';
                    for (let c = 16; c <= 22; c++) {
                        let cellVal = '-';
                        if (data[r] && data[r][c] !== undefined && data[r][c] !== null && data[r][c] !== "") {
                            cellVal = formatTimeToHHMM(data[r][c]);
                        }
                        rowHtml += `<td>${cellVal}</td>`;
                    }
                    rowHtml += '</tr>';
                    tbody.insertAdjacentHTML('beforeend', rowHtml);
                }
            }
        };

        window.onload = function () {
            generate22Sets();

            const scriptUrl = "https://script.google.com/macros/s/AKfycbxpBqQu6xrd0QoL6pj54OSgkkv0pncLV-8kh5q16K4hnmu-pPSgvNKGUoBP9C_62Kn7Dg/exec?callback=handleSheetData";

            let script = document.createElement('script');
            script.src = scriptUrl;
            document.body.appendChild(script);

            setInterval(() => {
                let oldScript = document.getElementById('dynamic-data-script');
                if (oldScript) oldScript.remove();

                let newScript = document.createElement('script');
                newScript.id = 'dynamic-data-script';
                newScript.src = scriptUrl + "&t=" + new Date().getTime();
                document.body.appendChild(newScript);
            }, 10000);
        };
    </script>
</body>

</html>
