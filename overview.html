<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>20-80 Layout with Tables</title>
    <style>
        body, html { height: 100vh; margin: 0; display: flex; flex-direction: column; font-family: 'Cambria', serif; }
        .top { 
            height: 20vh; 
            background: #f0f0f0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            border-bottom: 2px solid #ccc; 
            position: relative; /* बटन को पोजीशन देने के लिए */
        }
        
        /* --- RIGHT CORNER BUTTONS CONTAINER --- */
        .header-buttons {
            position: absolute;
            right: 25px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 10;
        }

        /* --- PDF & BACK BUTTON STYLING --- */
        .action-btn {
            background-color: #dc3545;
            color: #ffffff;
            border: 2px solid #a71d2a;
            border-radius: 6px;
            padding: 6px 14px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            transition: background-color 0.2s ease, transform 0.2s ease;
            white-space: nowrap;
        }

        .action-btn.pdf-btn {
            background-color: #dc3545;
            border-color: #a71d2a;
        }
        .action-btn.pdf-btn:hover {
            background-color: #a71d2a;
            transform: scale(1.05);
        }

        .action-btn.back-btn {
            background-color: #1f51ff;
            border-color: #001f3f;
        }
        .action-btn.back-btn:hover {
            background-color: #0035bd;
            transform: scale(1.05);
        }

        .bottom { height: 80vh; display: flex; gap: 20px; padding: 20px; box-sizing: border-box; }
        .box { flex: 1; border: 1px solid #ccc; overflow-y: auto; padding: 10px; background: #fafafa; display: flex; flex-direction: column; gap: 15px; }
        
        table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0 6px; 
            table-layout: fixed; 
            margin-bottom: 15px; 
        }
        
        th, td { 
            border: 1px solid #ccc; 
            padding: 8px; 
            text-align: center; 
            word-wrap: break-word; 
            text-transform: uppercase; 
        }
        
        th { 
            background: #007bff; 
            color: #fff; 
            border-radius: 8px; 
        }

        tr:not(:first-child) td:first-child {
            border-left: 1px solid #ccc;
            border-top-left-radius: 6px;
            border-bottom-left-radius: 6px;
        }

        tr:not(:first-child) {
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- ऊपर का 20% भाग -->
    <div class="top">
        <span>ऊपर का 20% भाग (Header Section)</span>
        
        <!-- दाईं ओर PDF और BACK बटन का ग्रुप -->
        <div class="header-buttons">
            <!-- PDF Download Button -->
            <a href="https://docs.google.com/spreadsheets/d/1GhaamtMtiFguLwsDbttYZHe5tLNV9RNwqmsX_vkQSoc/export?format=pdf&gid=1973573815&range=A1:D64" 
               class="action-btn pdf-btn" 
               target="_blank" 
               title="Download Range A1:D64 as PDF">
                📄 DOWNLOAD PDF
            </a>

            <!-- Back Button to Index / Form Page -->
            <a href="index.html" 
               class="action-btn back-btn" 
               title="Go back to Index / Booking Status">
                ⬅️ BACK
            </a>
        </div>
    </div>

    <!-- नीचे का 80% भाग -->
    <div class="bottom">
        
        <!-- पहला बॉक्स जिसमें बाईं ओर की चारों टेबल होंगी -->
        <div class="box">
            <!-- पहली टेबल (Overview - A2:D9) -->
            <table id="sheetTable">
                <colgroup>
                    <col style="width: 10%;">
                    <col style="width: 40%;">
                    <col style="width: 50%;">
                </colgroup>
                <tr>
                    <th colspan="3">OVERVIEW</th>
                </tr>
            </table>

            <!-- दूसरी टेबल (OCCUPENCY DETAILS - A12:D15) -->
            <table id="occupancyTable">
                <colgroup>
                    <col style="width: 10%;">
                    <col style="width: 40%;">
                    <col style="width: 50%;">
                </colgroup>
                <tr>
                    <th colspan="3">OCCUPENCY DETAILS</th>
                </tr>
            </table>

            <!-- तीसरी टेबल (MONTHLY AVRAGE MEALS - A18:D20) -->
            <table id="monthlyAvrageMealsTable">
                <colgroup>
                    <col style="width: 10%;">
                    <col style="width: 40%;">
                    <col style="width: 50%;">
                </colgroup>
                <tr>
                    <th colspan="3">MONTHLY AVRAGE MEALS</th>
                </tr>
            </table>

            <!-- चौथी टेबल (INSPECTION & DUES DATE) -->
            <table id="inspectionDuesDate">
                <colgroup>
                    <col style="width: 10%;">
                    <col style="width: 40%;">
                    <col style="width: 25%;">
                    <col style="width: 25%;">
                </colgroup>
                <tr>
                    <th colspan="4">INSPECTION & DUES DATE</th>
                </tr>
            </table>
        </div>

        <!-- दाईं ओर का बॉक्स जिसमें दोनों टेबल्स होंगी -->
        <div class="box">
            <table id="rightTable">
                <colgroup>
                    <col style="width: 10%;">
                    <col style="width: 40%;">
                    <col style="width: 25%;">
                    <col style="width: 25%;">
                </colgroup>
                <tr>
                    <th colspan="4">AMENITIES & FACILITIES</th>
                </tr>
            </table>

            <table id="rightTable2">
                <colgroup>
                    <col style="width: 10%;">
                    <col style="width: 40%;">
                    <col style="width: 25%;">
                    <col style="width: 25%;">
                </colgroup>
                <tr>
                    <th colspan="4">CONTACT NO.</th>
                </tr>
            </table>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyRJ4mnFgtEiW4ukVYUfxrGYpfmAmVm0ZDOjMMykWwDBcuXpPdiu2T9IjTMLfVjply7_A/exec';

        // तारीख को सही फॉर्मेट में बदलने का फंक्शन
        function formatDate(value, formatType = 'mmm-yyyy') {
            if (typeof value === 'string' && value.match(/^\d{4}-\d{2}-\d{2}T/)) {
                let date = new Date(value);
                if (!isNaN(date.getTime())) {
                    if (formatType === 'mmm-yyyy') {
                        let months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                        let mmm = months[date.getMonth()];
                        let yyyy = date.getFullYear();
                        return mmm + "-" + yyyy; 
                    } else if (formatType === 'dd-mm-yyyy') {
                        let dd = String(date.getDate()).padStart(2, '0');
                        let mm = String(date.getMonth() + 1).padStart(2, '0');
                        let yyyy = date.getFullYear();
                        return `${dd}-${mm}-${yyyy}`;
                    }
                }
            }
            return value;
        }

        // रो जोड़ने और राउंडेड कॉर्नर देने वाला जनरल फंक्शन
        function appendRowWithRoundedCorners(tableElement, rowData, isMerge3and4 = false, isOccupancyMonth = false, isInspectionTable = false) {
            let tr = document.createElement('tr');
            let validCells = rowData.filter(cell => cell !== "");
            
            if (isMerge3and4 && validCells.length === 3) {
                rowData.forEach((cellData, cellIndex) => {
                    if (cellData !== "") {
                        let td = document.createElement('td');
                        if (isInspectionTable && (cellIndex === 2 || cellIndex === 3)) {
                            td.textContent = formatDate(cellData, 'dd-mm-yyyy');
                        } else {
                            td.textContent = cellData;
                        }
                        if (cellIndex === 2) {
                            td.setAttribute('colspan', '2'); 
                        }
                        tr.appendChild(td);
                    }
                });
            } else {
                rowData.forEach((cellData, cellIndex) => {
                    let td = document.createElement('td');
                    if (isOccupancyMonth && cellIndex === 2) {
                        td.textContent = formatDate(cellData, 'mmm-yyyy');
                    } else if (isInspectionTable && (cellIndex === 2 || cellIndex === 3)) {
                        td.textContent = formatDate(cellData, 'dd-mm-yyyy');
                    } else {
                        td.textContent = cellData;
                    }
                    tr.appendChild(td);
                });
            }

            let tds = tr.querySelectorAll('td');
            if (tds.length > 0) {
                let lastTd = tds[tds.length - 1];
                lastTd.style.borderTopRightRadius = '6px';
                lastTd.style.borderBottomRightRadius = '6px';
            }

            tableElement.appendChild(tr);
        }

        fetch(scriptURL)
            .then(response => response.json())
            .then(data => {
                let sheetTable = document.getElementById('sheetTable');
                if (data.overview) {
                    data.overview.forEach(row => {
                        if (row.some(cell => cell !== "")) {
                            appendRowWithRoundedCorners(sheetTable, row);
                        }
                    });
                }

                let occupancyTable = document.getElementById('occupancyTable');
                if (data.occupancy) {
                    data.occupancy.forEach((row, index) => {
                        if (row.some(cell => cell !== "")) {
                            let isMonthRow = (index === 0);
                            appendRowWithRoundedCorners(occupancyTable, row, false, isMonthRow);
                        }
                    });
                }

                let monthlyTable = document.getElementById('monthlyAvrageMealsTable');
                if (data.monthly) {
                    data.monthly.forEach(row => {
                        if (row.some(cell => cell !== "")) {
                            appendRowWithRoundedCorners(monthlyTable, row);
                        }
                    });
                }
               
                let inspectionDuesDate = document.getElementById('inspectionDuesDate');
                if (data.inspection) {
                    data.inspection.forEach(rows => {
                        if (rows.some(cell => cell !== "")) {
                            appendRowWithRoundedCorners(inspectionDuesDate, rows, true, false, true);
                        }
                    });
                }

                let rightTable = document.getElementById('rightTable');
                if (data.rightTable) {
                    data.rightTable.forEach(row => {
                        if (row.some(cell => cell !== "")) {
                            appendRowWithRoundedCorners(rightTable, row, true);
                        }
                    });
                }

                let rightTable2 = document.getElementById('rightTable2');
                if (data.rightTable2) {
                    data.rightTable2.forEach(row => {
                        if (row.some(cell => cell !== "")) {
                            appendRowWithRoundedCorners(rightTable2, row, true);
                        }
                    });
                }
            })
            .catch(error => console.error('Error fetching sheet data:', error));
    </script>

</body>
</html>
